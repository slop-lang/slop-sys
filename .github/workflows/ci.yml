name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    name: Stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.63 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.63.0
      - run: cargo test --workspace --all-targets

  package:
    name: Package (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify license copies
        run: |
          cmp LICENSE slop-std-sys/LICENSE
          cmp LICENSE slop-rdf-sys/LICENSE
      - name: Verify package contents
        shell: bash
        run: |
          for package in slop-std-sys slop-rdf-sys; do
            files="$(cargo package -p "$package" --list)"
            grep -Fxq README.md <<<"$files"
            grep -Fxq LICENSE <<<"$files"
          done
      - run: cargo package --workspace
