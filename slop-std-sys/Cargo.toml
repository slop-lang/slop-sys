[package]
name = "slop-std-sys"
version = "0.1.2"
edition = "2021"
rust-version = "1.63"
links = "slop_std"
description = "Vendored SLOP std C (strlib, file, thread) + canonical slop_runtime.h, as a -sys crate"
license = "Apache-2.0"
repository = "https://github.com/slop-lang/slop-sys"
readme = "README.md"
keywords = ["slop", "ffi", "sys", "runtime"]
categories = ["external-ffi-bindings"]
publish = ["crates-io"]
include = ["src/**/*", "tests/**/*", "csrc/**/*", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "slop_std_sys"

[build-dependencies]
cc = "1"
